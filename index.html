    <style>
      /* CSS Anda tetap sama */
      .text-outlined {
        -webkit-text-stroke: 8px white;
        text-stroke: 8px white;
        color: #E05845;
        paint-order: stroke fill;
        font-weight: 400;
      }
      @media (min-width: 768px) {
        .text-outlined { -webkit-text-stroke: 10px white; text-stroke: 10px white; }
      }
      @media (min-width: 1024px) {
        .text-outlined { -webkit-text-stroke: 12px white; text-stroke: 12px white; }
      }

      @keyframes marquee-left  { 0% { transform: translateX(0%);   } 100% { transform: translateX(-50%); } }
      @keyframes marquee-right { 0% { transform: translateX(-50%); } 100% { transform: translateX(0%);   } }

      @font-face {
        font-family: 'Vlogger';
        src: url('/fonts/Vlogger.woff') format('woff'),
             url('/fonts/Vlogger.ttf') format('truetype'),
             url('/fonts/Vlogger.otf') format('opentype');
        font-weight: normal;
        font-style: normal;
        font-display: swap;
      }

      .marquee-left  { animation: marquee-left  40s linear infinite; }
      .marquee-right { animation: marquee-right 40s linear infinite; }

      .text-shadow-outline {
        color: #E05845;
        text-shadow:
          -2px -2px 0 white,  2px -2px 0 white,
          -2px  2px 0 white,  2px  2px 0 white,
          -4px -4px 0 white,  4px -4px 0 white,
          -4px  4px 0 white,  4px  4px 0 white,
          -6px -6px 0 white,  6px -6px 0 white,
          -6px  6px 0 white,  6px  6px 0 white,
          -8px -8px 0 white,  8px -8px 0 white,
          -8px  8px 0 white,  8px  8px 0 white,
          -6px 0 0 white, 6px 0 0 white, 0 -6px 0 white, 0 6px 0 white,
          -8px 0 0 white, 8px 0 0 white, 0 -8px 0 white, 0 8px 0 white;
        font-weight: 900;
      }

      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>

    <link rel="stylesheet" href="/index.css" />
