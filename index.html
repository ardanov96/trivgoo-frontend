    <script src="https://cdn.tailwindcss.com"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito:wght@300;400;600;700;800&family=Rubik:wght@600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Nunito', 'sans-serif'],
              serif: ['Rubik', 'sans-serif'],
            },
            colors: {
              primary: {
                50: '#fef5f3',
                100: '#fde8e4',
                200: '#fbd1ca',
                300: '#f7aea1',
                400: '#f18169',
                500: '#e6654d',
                600: '#E05845',  
                700: '#c34134',
                800: '#a23830',
                900: '#85322e',
              },
              accent: {
                500: '#f97316',
                600: '#ea580c',
              },
            },
            boxShadow: {
              soft: '0 10px 40px -10px rgba(0,0,0,0.08)',
            },
          },
        },
      };
    </script>
    <style>
      /* Text Outline Effects - EXTRA TEBAL seperti Logo */
      .text-outlined {
        -webkit-text-stroke: 8px white;
        text-stroke: 8px white;
        color: #E05845;
        paint-order: stroke fill;
        font-weight: 400; /* ← turunkan dari 900 */
      }

      @media (min-width: 768px) {
        .text-outlined {
          -webkit-text-stroke: 10px white;
          text-stroke: 10px white;
        }
      }

      @media (min-width: 1024px) {
        .text-outlined {
          -webkit-text-stroke: 12px white;
          text-stroke: 12px white;
        }
      }

      @keyframes marquee-left {
        0% { transform: translateX(0%); }
        100% { transform: translateX(-50%); }
      }

      @keyframes marquee-right {
        0% { transform: translateX(-50%); }
        100% { transform: translateX(0%); }
      }

      @font-face {
        font-family: 'Vlogger';
        src: url('/fonts/Vlogger.woff') format('woff'),
            url('/fonts/Vlogger.ttf') format('truetype'),
            url('/fonts/Vlogger.otf') format('opentype');
        font-weight: normal;
        font-style: normal;
        font-display: swap;
      }

      .marquee-left {
        animation: marquee-left 40s linear infinite;
      }

      .marquee-right {
        animation: marquee-right 40s linear infinite;
      }
      
      /* Alternative: Shadow-based outline SUPER TEBAL */
      .text-shadow-outline {
        color: #E05845;
        text-shadow: 
          /* Layer 1 - Inner */
          -2px -2px 0 white, 2px -2px 0 white,
          -2px  2px 0 white, 2px  2px 0 white,
          /* Layer 2 */
          -4px -4px 0 white, 4px -4px 0 white,
          -4px  4px 0 white, 4px  4px 0 white,
          /* Layer 3 */
          -6px -6px 0 white, 6px -6px 0 white,
          -6px  6px 0 white, 6px  6px 0 white,
          /* Layer 4 - Outer */
          -8px -8px 0 white, 8px -8px 0 white,
          -8px  8px 0 white, 8px  8px 0 white,
          /* Cardinal directions */
          -6px 0 0 white, 6px 0 0 white,
          0 -6px 0 white, 0  6px 0 white,
          -8px 0 0 white, 8px 0 0 white,
          0 -8px 0 white, 0  8px 0 white;
        font-weight: 900;
      }
      
      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
    </style>
