# ==============================================================
# TRIVGOO NGINX DYNAMIC RENDERING (PRERENDER.IO) CONFIGURATION
# ==============================================================
# 
# PANDUAN INSTALASI:
# 1. Buka file konfigurasi Nginx server Anda (biasanya di /etc/nginx/sites-available/trivgoo)
# 2. Masukkan blok ini di dalam block `server { ... }` utama Anda.
# 3. Ganti "YOUR_PRERENDER_TOKEN_HERE" dengan token dari dashboard Prerender.io.
# 4. Restart Nginx dengan `sudo systemctl restart nginx` atau `sudo nginx -s reload`.

# Definisikan direktori cache (letakkan sintaks ini DI LUAR block server { ... }, biasanya di dalam /etc/nginx/nginx.conf file pada block http!)
# proxy_cache_path /var/cache/nginx/prerender levels=1:2 keys_zone=prerender_cache:10m max_size=100m inactive=60m;

server {
    # ... ssl, server_name, dan basic config trivgoo lainnya ...

    # 1. CORE: BOT DETECTION LOGIC
    set $prerender 0;
    
    # Deteksi Crawler / Sosmed Scraper Utama
    if ($http_user_agent ~* "googlebot|bingbot|yandex|baiduspider|facebookexternalhit|twitterbot|whatsapp|telegrambot|linkedinbot") {
        set $prerender 1;
    }
    # Fallback legacy hash-bang URL untuk bot
    if ($args ~ "_escaped_fragment_") {
        set $prerender 1;
    }

    # 2. SELECTIVE RENDERING (OPTIMIZATION)
    # HANYA Render SPA ke Prerender untuk rute yang berdampak pada SEO
    # Jika rute tidak match dengan regex di bawah ini, batalkan prerender agar hemat quota!
    # Anda dapat menambah rute statis lainnya di dalam blok | ini
    set $seo_routes 0;
    if ($uri ~* "^/(product|blog|explore|about-us|contact|help-center|career|privacy-policy|terms|press|trivpay|id/|en/|zh/|ja/|ar/)") {
        set $seo_routes 1;
    }
    
    # Jangan render untuk area transaksional dan otentikasi
    if ($uri ~* "^/(login|register|checkout|dashboard|payment|admin|agent|my-account|my-bookings|wishlist)") {
        set $seo_routes 0;
    }

    # Hitung kelayakan (Bot + SEO Route)
    set $should_prerender "$prerender$seo_routes";

    # Header tambahan untuk monitoring/debugging apakah route di-pass ke prerender (Opsional)
    add_header X-Prerender-Status $should_prerender;

    # 3. ROOT LOCATION & PROXY PASS
    location / {
        # Jika bot + Rute valid di atas ("11")
        if ($should_prerender = "11") {
            # Opsional: Jika menggunakan cloud service (Resolusi DNS Prerender)
            # resolver 8.8.8.8 8.8.4.4;

            # 4. CACHE LAYER MAPPED
            # Penting untuk performa dan agar tidak over limit tier gratis
            # proxy_cache prerender_cache;
            # proxy_cache_valid 200 301 302 10m;
            
            # Autentikasi dengan token agar IP anda tidak ditolak (Opsional tapi sangat direkomendasikan)
            # proxy_set_header X-Prerender-Token YOUR_PRERENDER_TOKEN_HERE;

            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            
            # Teruskan request ini dengan skema yang bersih
            proxy_pass http://service.prerender.io/$scheme://$host$request_uri;
            break;
        }

        # 5. FALLBACK SPA NORMAL
        # Jika bukan bot (Atau rute non-SEO), arahkan langsung ke index SPA statis (Cepat)
        try_files $uri $uri/ /index.html;
    }

    # Konfigurasi fallback error untuk menjaga robustness
    error_page 500 502 503 504 /index.html;
}
